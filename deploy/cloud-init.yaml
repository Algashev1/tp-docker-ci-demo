#cloud-config
# Вставляется в поле cloud-init при создании ВМ (Ubuntu 24.04).
package_update: true
packages:
  - docker.io
  - docker-compose-v2
  - curl
write_files:
  - path: /etc/docker/daemon.json
    content: |
      {"registry-mirrors": ["https://mirror.gcr.io"]}
  - path: /etc/cron.d/app-deploy
    content: |
      */2 * * * * root curl -fsSL https://raw.githubusercontent.com/Algashev1/tp-docker-ci-demo/main/deploy/pull.sh | sh >> /var/log/app-deploy.log 2>&1
runcmd:
  - mkdir -p /opt/app
  - sh -c 'echo "DB_PASSWORD=$(openssl rand -hex 16)" > /opt/app/.env && echo "FRONT_PORT=80" >> /opt/app/.env'
  - systemctl restart docker
  - sh -c 'curl -fsSL https://raw.githubusercontent.com/Algashev1/tp-docker-ci-demo/main/deploy/pull.sh | sh >> /var/log/app-deploy.log 2>&1'
