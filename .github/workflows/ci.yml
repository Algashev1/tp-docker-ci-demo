name: CI
on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stack:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
    - name: Настройки
      run: cp .env.example .env
    - name: Сборка и запуск
      run: docker compose up -d --build --wait
    - name: Тесты бэкенда
      run: docker compose exec -T backend pytest -v
    - name: Smoke-тест
      run: |
        curl -f http://localhost:8080/health
        curl -f http://localhost:3000
        curl -f http://localhost:3000/api/auth/status
    - name: Логи при падении
      if: failure()
      run: docker compose logs
    - name: Остановить
      if: always()
      run: docker compose down -v

  publish:
    needs: stack
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@v4
    - name: Вход в GitHub Container Registry
      run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
    - name: Сборка образов
      run: |
        cp .env.example .env
        docker compose build backend frontend
    - name: Публикация образов
      run: |
        docker compose push backend frontend
        for s in backend frontend; do
          img=ghcr.io/algashev1/tp-docker-ci-demo-$s
          docker tag $img:latest $img:${{ github.sha }}
          docker push $img:${{ github.sha }}
        done
