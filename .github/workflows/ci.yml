name: CI
on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stack:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
    - name: Настройки
      run: cp .env.example .env
    - name: Сборка и запуск
      run: docker compose up -d --build --wait
    - name: Тесты бэкенда
      run: docker compose exec -T backend pytest -v
    - name: Smoke-тест
      run: |
        curl -f http://localhost:3000
        curl -f http://localhost:3000/api/auth/status
    - name: Логи при падении
      if: failure()
      run: docker compose logs
    - name: Остановить
      if: always()
      run: docker compose down -v

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    # Сторонние actions закреплены по полному SHA коммита, а не по тегу:
    # тег можно перезаписать (так атаковали trivy-action в марте 2026).
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      with:
        fetch-depth: 0
    # 1. Секреты в коде и в истории коммитов
    - name: Поиск секретов (gitleaks)
      uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7  # v2.3.9
      continue-on-error: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    # 2. Уязвимые Python-зависимости (A03 - цепочка поставок)
    - name: Аудит зависимостей (pip-audit)
      continue-on-error: true
      run: |
        python -m pip install --quiet pip-audit
        pip-audit -r backend/requirements.txt
    # 3. Небезопасные места в коде бэкенда (A05, A06)
    - name: Статический анализ (bandit)
      continue-on-error: true
      run: |
        python -m pip install --quiet bandit
        bandit -r backend/app
    # 4. Уязвимости в файлах проекта и Dockerfile (A03)
    - name: Сканирование проекта (trivy)
      continue-on-error: true
      uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1  # v0.35.0
      with:
        version: v0.69.3
        scan-type: fs
        scan-ref: .
        severity: HIGH,CRITICAL

  publish:
    needs: stack
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@v4
    - name: Вход в GitHub Container Registry
      run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
    - name: Сборка образов
      run: |
        cp .env.example .env
        docker compose build backend frontend
    - name: Публикация образов
      run: |
        docker compose push backend frontend
        for s in backend frontend; do
          img=ghcr.io/algashev1/tp-docker-ci-demo-$s
          docker tag $img:latest $img:${{ github.sha }}
          docker push $img:${{ github.sha }}
        done
