server {
    listen 80;
    root /usr/share/nginx/html;
    server_tokens off;

    # Базовые заголовки безопасности (разбираются на лекции 7)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'" always;

    location /api/ {
        proxy_pass http://backend:8080;
    }
}
