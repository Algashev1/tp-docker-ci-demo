services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready -U app
      interval: 5s
      retries: 10

  backend:
    image: ghcr.io/algashev1/tp-docker-ci-demo-backend:latest
    build: ./backend
    environment:
      DATABASE_URL: postgresql://app:${DB_PASSWORD}@db:5432/app
    depends_on:
      db: { condition: service_healthy }
    ports: ["8080:8080"]
    healthcheck:
      test: python -c "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"
      interval: 5s
      retries: 10

  frontend:
    image: ghcr.io/algashev1/tp-docker-ci-demo-frontend:latest
    build: ./frontend
    depends_on: [backend]
    ports: ["3000:80"]

volumes:
  pgdata:
